[project]
name = "wellora-backend"
version = "3.0.0"
description = "Wellora holistic health assistant API"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["wellora"]
omit = ["wellora/services/assistant_responses.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["wellora/services/assistant_responses.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF003", "UP045", "UP007"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
