# Optional: `pip install pre-commit && pre-commit install` to lint on every commit.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
  - repo: local
    hooks:
      - id: frontend-lint
        name: frontend lint + typecheck
        entry: bash -c 'cd frontend && npm run lint && npm run typecheck'
        language: system
        files: ^frontend/.*\.(ts|tsx|js)$
        pass_filenames: false
